# omen-kbd configuration. Zone order everywhere: left, middle, right, wasd.
# Colors are always #rrggbb. Nothing here ships with a color except the game profile.
[device]
zone_map = { left = 2, middle = 1, right = 0, wasd = 3 }

[effects]
enabled = false   # effects are opt-in (the colors may live in non-volatile memory)
fps = 10          # how often the daemon looks at an effect; the frame itself changes twice a second

[gates]
on_lock = "off"
on_idle = "dim"
dim_brightness = 20
pause_effects_on_battery = true

# Short keyboard reactions. A missing [reactions] table means off. A reaction with no color set is
# off, so only the window pulses run until you add colors. Every key is optional.
[reactions]
enabled = true
step_ms = 120            # one step of a sweep or pulse (60-1000)
blink_ms = 150           # one on or off phase of a blink (60-1000)
max_per_minute = 30      # short reactions started per rolling minute (1-600)

[reactions.workspace]
# color = "#b4befe"      # a sweep across the zones on a workspace switch
wasd_with = "left"       # "left" | "middle" | "none"

[reactions.window]
open = 0.5               # move toward white by this much (0-1; 0 = off)
close = 0.35             # dip to this fraction (0-1; 1 = off)
cooldown_ms = 500        # (0-10000)

[reactions.notify]
# color = "#89b4fa"      # a flash for each notification
# critical = "#f38ba8"   # a critical notification
min_urgency = "normal"   # "low" | "normal" | "critical"
skip_if_focused = true
# [reactions.notify.apps]  # per-app colors, matched case-insensitively; quote keys with dots
# zapzap = "#a6e3a1"

[reactions.urgent]
zones = ["right"]        # [] turns the lamp off
# color = "#f9e2af"      # the attention light for an urgent window
blinks = 2               # (0-5); then steady

[reactions.agent]
zones = ["wasd"]         # [] turns the lamp off
# waiting = "#ffb000"    # Claude Code is waiting for you
# done = "#a6e3a1"       # Claude Code finished
blinks = 2               # (0-5); then steady
ttl_s = 3600             # (60-86400)

# Profiles are named looks: `omen-kbd set game`. Add your own. colors is one color (all zones) or
# four (left, middle, right, wasd); effect is static, drift, glow, tide or dusk; speed is 1-100.
#   drift and dusk use all four colors as stops, glow the first two, tide the first three for the
#   wave and the fourth (WASD) as a steady accent. Effects need [effects] enabled = true.
[[profiles]]
name = "game"
colors = ["#202020", "#202020", "#202020", "#ff0000"]

[[rules]]
name = "gamemode"
when = { gamemode = true }
profile = "game"

# Rules are first-match per category, so this one must come before "power saver dims".
[[rules]]
name = "fullscreen video dims"
when = { fullscreen_app = ["mpv", "vlc", "firefox", "chromium"] }  # ["*"] matches any app
brightness_cap = 15

[[rules]]
name = "power saver dims"
when = { power_profile = "power-saver" }
brightness_cap = 40

