# omen-kbd configuration. Zone order everywhere: left, middle, right, wasd.
[device]
zone_map = { left = 2, middle = 1, right = 0, wasd = 3 }

[effects]
enabled = false   # animations are opt-in (colors may live in non-volatile memory)
fps = 10

[theme]
colors = "vivid"  # or "exact"
dir = "~/.config/theming/current"

[gates]
on_lock = "off"
on_idle = "dim"
dim_brightness = 20
pause_effects_on_battery = true

[hints]
timeout_s = 15
delay_ms = 250
[hints.modifiers]
super = "theme:mauve"
"super+shift" = "theme:blue"
ctrl = "theme:peach"
[hints.submaps]
resize = "theme:teal"

# Short keyboard reactions. A missing [reactions] table means off; every key below is optional.
[reactions]
enabled = true
step_ms = 120            # one step of a sweep or pulse (60-1000)
blink_ms = 150           # one on or off phase of a blink (60-1000)
max_per_minute = 30      # short reactions started per rolling minute (1-600)

[reactions.workspace]
color = "theme:lavender"
wasd_with = "left"       # "left" | "middle" | "none"

[reactions.window]
open = 0.5               # move toward white by this much (0-1; 0 = off)
close = 0.35             # dip to this fraction (0-1; 1 = off)
cooldown_ms = 500        # (0-10000)

[reactions.notify]
color = "theme:blue"
critical = "theme:red"
min_urgency = "normal"   # "low" | "normal" | "critical"
skip_if_focused = true
# quote keys that contain dots: "com.example.app" = "theme:blue"
[reactions.notify.apps]  # matched case-insensitively; this table replaces the built-in apps
zapzap = "theme:green"
discord = "#5865f2"

[reactions.urgent]
zones = ["right"]        # [] turns the lamp off
color = "theme:yellow"
blinks = 2               # (0-5); then steady

[reactions.agent]
zones = ["wasd"]         # [] turns the lamp off
waiting = "theme:peach"  # orange on the keyboard with colors = "vivid"; "#ffb000" is true amber
done = "theme:green"
blinks = 2               # (0-5); then steady
ttl_s = 3600             # (60-86400)

[[profiles]]
name = "default"
colors = ["theme:mauve", "theme:blue", "theme:teal", "theme:peach"]

[[profiles]]
name = "game"
colors = ["#202020", "#202020", "#202020", "#ff0000"]

[[profiles]]
name = "white"
colors = ["#ffffff"]

[[rules]]
name = "gamemode"
when = { gamemode = true }
profile = "game"

# Rules are first-match per category, so this one must come before "power saver dims".
[[rules]]
name = "fullscreen video dims"
when = { fullscreen_app = ["mpv", "vlc", "firefox", "chromium"] }  # ["*"] matches any app
brightness_cap = 15

[[rules]]
name = "power saver dims"
when = { power_profile = "power-saver" }
brightness_cap = 40

[[rules]]
name = "low battery"
when = { on_battery = true, battery_below = 15 }
overlay = { zones = ["right"], color = "#ff0000", pulse = true }
