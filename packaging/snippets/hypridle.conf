# omen-kbd: two edits to ~/dotfiles/config-hypr/.config/hypr/hypridle.conf
# (full paths: Hyprland's PATH, which hypridle inherits, has no ~/.local/bin).
#
# 1. Lock gate. Add these two lines inside the existing `general { }` block.
#    hypridle runs them whenever the session locks and unlocks, however the
#    lock started (keybind, idle listener, before sleep). Without them the
#    keyboard stays lit on the lock screen. What "locked" does is set by
#    [gates] on_lock in ~/.config/omen-kbd/config.toml (default: off).

general {
    on_lock_cmd = ~/.local/bin/omen-kbd flag locked on
    on_unlock_cmd = ~/.local/bin/omen-kbd flag locked off
}

# 2. Idle gate. Replace the first listener (brightnessctl on rgb:kbd_backlight,
#    a device that does not exist here); timeout and conditions stay the same.
#    What "idle" does is set by [gates] on_idle (default: dim to 20%), so the
#    file's header line "keyboard backlight off 2.5 min" becomes "keyboard dims".

listener {
    timeout = 150
    condition_cmd = ~/.config/rice/bin/rice-idle quiet
    condition_retry = 30
    on-timeout = ~/.local/bin/omen-kbd idle on     # keyboard dims ([gates] on_idle)
    on-resume = ~/.local/bin/omen-kbd idle off
}
