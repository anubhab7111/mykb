[package]
name = "omen-kbd"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
futures-util = "0.3.34"
inotify = "0.11.5"
libc = "0.2.191"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs", "signal"] }
toml = "1.1.8"
zbus = { version = "6.0.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3.27.0"
